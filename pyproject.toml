[project]
name = "invoice-ledger"
version = "0.1.0"
description = "Multi-currency supplier invoices, payments, and accounting reports"
readme = "README.md"
authors = [
    { name = "samu187", email = "samuel-alciati@live.it" }
]
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
app = "invoice_ledger.cli:main"
invoice-ledger = "invoice_ledger.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
