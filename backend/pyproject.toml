[project]
name = "invoice-ledger"
version = "0.1.0"
description = "Multi-currency supplier invoices, payments, and accounting reports"
authors = [{ name = "samu187", email = "samuel-alciati@live.it" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16,<1",
    "pydantic>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
app = "app.cli:main"
invoice-ledger = "app.cli:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
